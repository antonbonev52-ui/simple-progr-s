<!-- Supabase → Authentication → Emails → Confirm signup
     Subject: Your My Fitness Log code: {{ .Token }}
     Paste everything below into the "Message body" (Source) box. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Confirm your account</title>
</head>
<body style="margin:0;padding:0;background:#0e0f13;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0e0f13;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background:#181a20;border-radius:20px;">
          <tr>
            <td align="center" style="padding:36px 28px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <div style="display:inline-block;width:56px;height:56px;line-height:56px;border-radius:16px;background:#c6ff3d;color:#0e0f13;font-size:28px;font-weight:800;">💪</div>
              <h1 style="margin:20px 0 6px;color:#f2f3f5;font-size:24px;font-weight:800;">Welcome to My Fitness Log</h1>
              <p style="margin:0;color:#8b909c;font-size:15px;line-height:1.5;">Type this code in the app to confirm your account:</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 28px;">
              <div style="display:inline-block;padding:16px 26px;border-radius:14px;background:#0e0f13;border:1.5px solid #c6ff3d;color:#c6ff3d;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:8px;">{{ .Token }}</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <p style="margin:0 0 14px;color:#8b909c;font-size:13px;line-height:1.5;">The code works for a limited time. If you didn't sign up, you can ignore this email.</p>
              <p style="margin:0;color:#8b909c;font-size:13px;line-height:1.5;">On a computer? You can also <a href="{{ .ConfirmationURL }}" style="color:#c6ff3d;font-weight:700;text-decoration:none;">confirm with this link</a>.</p>
            </td>
          </tr>
        </table>
        <p style="margin:18px 0 0;color:#5c606b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;">My Fitness Log · simple tracking for lifting, cardio and swimming</p>
      </td>
    </tr>
  </table>
</body>
</html>
