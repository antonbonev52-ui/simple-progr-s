<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Fitness Log</title>
  <meta name="description" content="Simple workout, cardio and swim tracker.">
  <meta name="theme-color" content="#0e0f13">

  <!-- Makes it behave like a real app when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitLog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <!-- Rest timer bar (shown after you tick a set) -->
  <div id="restbar" class="restbar hidden"></div>

  <!-- Bottom tab bar -->
  <nav class="nav">
    <button data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
      <span>Today</span>
    </button>
    <button data-act="tab" data-tab="history">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>History</span>
    </button>
    <button data-act="tab" data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>
      <span>Progress</span>
    </button>
    <button data-act="tab" data-tab="programs">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span>Programs</span>
    </button>
  </nav>

  <!-- Pop-up windows (exercise picker, program editor) -->
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
